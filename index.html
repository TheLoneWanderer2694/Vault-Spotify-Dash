<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roku Spotify Clock Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e0e0e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        /* Clock Section */
        .clock-container {
            text-align: center;
            margin-top: 5vh;
        }

        #time {
            font-size: 11vw;
            font-weight: 700;
            letter-spacing: -2px;
            color: #f0f0f0;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        #date {
            font-size: 2vw;
            color: #888;
            margin-top: -10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Spotify Widget Section */
        .spotify-widget {
            background: #181818;
            border-radius: 16px;
            padding: 20px 30px;
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #282828;
            margin-bottom: 2vh;
        }

        .album-art {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background-color: #282828;
            object-fit: cover;
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .track-artist {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.2s;
        }

        .btn:hover {
            color: #1db954;
            transform: scale(1.1);
        }

        .login-prompt {
            text-align: center;
            margin-bottom: 5vh;
        }

        .login-btn {
            background-color: #1db954;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
            transition: background 0.2s;
            display: inline-block;
        }

        .login-btn:hover {
            background-color: #1ed760;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Clock Container -->
    <div class="clock-container">
        <div id="time">00:00:00</div>
        <div id="date">Loading date...</div>
    </div>

    <!-- Login Prompt (Shown if not logged in) -->
    <div id="loginSection" class="login-prompt">
        <p style="margin-bottom: 15px; color: #888;">Connect your Spotify account to control playback on your Roku</p>
        <button id="loginBtn" class="login-btn">CONNECT SPOTIFY</button>
    </div>

    <!-- Spotify Widget Container (Shown when logged in) -->
    <div id="spotifyWidget" class="spotify-widget hidden">
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div class="track-info">
            <div id="trackTitle" class="track-title">Not Playing</div>
            <div id="trackArtist" class="track-artist">Open Spotify on Roku</div>
        </div>
        <div class="spotify-controls">
            <button class="btn" onclick="controlPlayback('previous')">⏮</button>
            <button id="playPauseBtn" class="btn" onclick="togglePlayPause()">▶</button>
            <button class="btn" onclick="controlPlayback('next')">⏭</button>
        </div>
    </div>

    <script>
        const CLIENT_ID = '9a4eb75b171544f9a7a2b641479edab7';
        // Clean origin + pathname without query strings
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

        let accessToken = localStorage.getItem('spotify_access_token');
        let refreshToken = localStorage.getItem('spotify_refresh_token');
        let isPlaying = false;

        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            document.getElementById('time').innerText = `${formattedHours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function redirectToAuth() {
            const codeVerifier = generateRandomString(64);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            window.localStorage.setItem('spotify_code_verifier', codeVerifier);

            const authUrl = new URL("https://accounts.spotify.com/authorize");
            const params = {
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: REDIRECT_URI,
            };

            authUrl.search = new URLSearchParams(params).toString();
            window.location.href = authUrl.toString();
        }

        document.getElementById('loginBtn').addEventListener('click', redirectToAuth);

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const codeVerifier = localStorage.getItem('spotify_code_verifier');
                await exchangeCodeForToken(code, codeVerifier);
                // Clean code parameter from URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (accessToken) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('spotifyWidget').classList.remove('hidden');
                fetchCurrentPlayback();
                setInterval(fetchCurrentPlayback, 3000);
            }
        };

        async function exchangeCodeForToken(code, codeVerifier) {
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier,
                    }),
                });

                const data = await response.json();
                if (data.access_token) {
                    accessToken = data.access_token;
                    localStorage.setItem('spotify_access_token', accessToken);
                    if (data.refresh_token) {
                        refreshToken = data.refresh_token;
                        localStorage.setItem('spotify_refresh_token', refreshToken);
                    }
                }
            } catch (error) {
                console.error('Error exchanging code for token:', error);
            }
        }

        async function fetchCurrentPlayback() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                if (response.status === 401) {
                    localStorage.removeItem('spotify_access_token');
                    location.reload();
                    return;
                }

                if (response.status === 204 || response.status === 205) {
                    document.getElementById('trackTitle').innerText = 'Nothing Playing';
                    document.getElementById('trackArtist').innerText = 'Open Spotify app on Roku';
                    document.getElementById('albumArt').src = '';
                    return;
                }

                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('trackTitle').innerText = data.item.name;
                    document.getElementById('trackArtist').innerText = data.item.artists.map(a => a.name).join(', ');
                    document.getElementById('albumArt').src = data.item.album.images[0].url;
                    
                    isPlaying = data.is_playing;
                    document.getElementById('playPauseBtn').innerText = isPlaying ? '⏸' : '▶';
                }
            } catch (error) {
                console.error('Error fetching playback state:', error);
            }
        }

        async function togglePlayPause() {
            const endpoint = isPlaying ? 'pause' : 'play';
            await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            setTimeout(fetchCurrentPlayback, 500);
        }

        async function controlPlayback(action) {
            await fetch(`https://api.spotify.com/v1/me/player/${action}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            setTimeout(fetchCurrentPlayback, 500);
        }
    </script>
</body>
</html>
